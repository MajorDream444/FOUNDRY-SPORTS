<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foundry Sports OS — Discovery prototype</title>
<style>
:root{--bg:#f4f3ee;--ink:#172422;--muted:#64716f;--line:#d4d8d2;--teal:#276454;--lime:#d5ed9a;--surface:#fafaf7;--radius:5px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--teal);border-radius:var(--radius);background:transparent;color:var(--teal);padding:10px 16px;font-weight:600}button:hover{background:#e4ebe4}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--teal);color:white}button.primary:hover{background:#1d5144}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #92af59;outline-offset:3px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #b9c2ba;background:var(--surface);border-radius:var(--radius);color:var(--ink)}textarea{min-height:90px;resize:vertical}label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}.notice{padding:10px 24px;border-bottom:1px solid var(--line);font-size:13px;background:var(--surface)}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 41px)}aside{background:var(--ink);color:white;padding:28px 24px;display:flex;flex-direction:column}.brand{font-size:29px;line-height:1.15;font-weight:700}.brand span{display:block;color:#bdc9c5;font-weight:400}nav{margin-top:48px;display:grid;gap:9px}nav button{text-align:left;color:#f7faf4;border:none;padding:14px 16px;font-size:18px;font-weight:400}nav button:hover{background:#254039}nav button.active{background:#294f44;border-left:4px solid var(--lime);padding-left:12px}.identity{margin-top:auto;padding-top:50px}.identity strong{display:block;letter-spacing:.4em;font-size:12px;border-top:1px solid #6e8580;padding-top:22px}.identity small{display:block;color:#bdc9c5;font-size:12px;margin-top:12px}main{padding:24px 34px 34px;max-width:1700px;width:100%}.toolbar{display:flex;justify-content:flex-end;gap:12px;align-items:center}.toolbar select{width:205px}.toolbar label{margin:0;color:var(--muted)}h1{font-size:clamp(30px,3.2vw,46px);line-height:1.12;letter-spacing:-1.2px;margin:20px 0 12px}h2{font-size:23px;line-height:1.3;margin:0 0 8px;letter-spacing:-.4px}h3{font-size:18px;margin:0 0 5px}p{margin:0 0 14px}.sub{font-size:21px;color:var(--muted);margin-bottom:24px}.muted{color:var(--muted)}.assignment{margin:24px 0 14px}.assignment h2{margin-bottom:0}.grid{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(250px,1fr);gap:16px}.stack{display:grid;gap:16px}.panel{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:#fafaf744}.panel p{color:var(--muted)}.task{display:grid;grid-template-columns:minmax(180px,1.7fr) 75px minmax(110px,1fr) auto;gap:16px;align-items:center;padding:22px 0;border-top:1px solid var(--line)}.task:last-child{padding-bottom:4px}.task-title{font-size:16px;font-weight:600}.status{font-size:11px;letter-spacing:1px;font-weight:700;border-radius:4px;background:#dce9e5;padding:8px;text-align:center}.status.hold{background:#f6dfb1;color:#68450f}.status.pass{background:var(--lime);color:#274924}.status.stop{background:#f4d7d4;color:#802b27}.task-meta{font-size:13px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.review-row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}.empty{border:1px solid var(--line);padding:12px;color:var(--muted);font-size:14px;margin-top:12px}.guidance{display:flex;flex-direction:column;gap:16px}.guidance .primary{width:100%}.tiny{font-size:12px;color:var(--muted)}.log{padding:12px 0;border-top:1px solid var(--line);font-size:14px}.log strong{display:block}.footer{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:22px;font-size:12px;color:var(--muted)}.footer button{font-size:12px;padding:6px 10px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.step{border-top:2px solid var(--teal);padding:18px 0}.step .number{color:var(--teal);font-size:12px;letter-spacing:2px}.permission{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}.permission small{display:block;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.banner{background:#e5ebe0;border-left:3px solid var(--teal);padding:12px 16px;margin-bottom:18px;font-size:14px}.detail{background:#e9eee7;padding:14px;border-left:3px solid var(--teal);margin:10px 0 16px}.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0}.check input{width:auto;margin-top:6px}.check label{margin:0;font-size:15px;font-weight:400}dialog{width:min(650px,calc(100% - 32px));padding:28px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;max-height:90vh;overflow:auto}dialog::backdrop{background:#17242280}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px}dialog h2{margin:0}.error{color:#8a3025;min-height:24px;font-size:14px}.success{color:var(--teal);font-size:14px}#toast{position:fixed;bottom:24px;right:24px;max-width:min(440px,90vw);background:var(--ink);color:white;padding:13px 20px;border-radius:6px;box-shadow:0 5px 20px #0002;z-index:3}#toast:empty{display:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1100px){.grid{grid-template-columns:1fr}.task{grid-template-columns:minmax(160px,1fr) 75px auto}.task-meta{grid-row:2;grid-column:1/3}main{padding:24px}.guidance{gap:8px}.sub{font-size:18px}}@media(max-width:700px){.shell{display:block}aside{padding:18px 20px}.brand{font-size:23px}.brand span{display:inline;margin-left:8px}nav{display:flex;margin-top:18px;gap:4px}nav button{font-size:16px;padding:9px 14px}nav button.active{border-left:0;border-bottom:3px solid var(--lime);padding-left:14px}.identity{display:none}main{padding:18px}.toolbar{justify-content:space-between}.toolbar label{font-size:13px}.toolbar select{width:180px}h1{font-size:32px;margin-top:24px}.notice{padding:10px 16px}.steps,.two{grid-template-columns:1fr}.review-row{grid-template-columns:1fr}.task{gap:10px;grid-template-columns:minmax(0,1fr) 68px auto}.task-title{font-size:14px}.task button{padding:8px 12px}.panel{padding:16px}.permission{align-items:flex-start}.footer{gap:10px}.sub{margin-bottom:18px}}
</style>
</head>
<body>
<div class="notice">Discovery prototype · Fictional data · Decisions are simulated · No live AI or authentication</div>
<div class="shell"><aside><div class="brand">Foundry<span>Sports OS</span></div><nav aria-label="Entry points"><button data-page="prepare">Prepare</button><button data-page="deliver" class="active">Deliver</button><button data-page="build">Build</button></nav><div class="identity"><strong>HAMAL</strong><small>Hanzo · Art Mob AGInts · Lux<br>Proposed sports vertical</small></div></aside>
<main><div class="toolbar"><label for="role">Explore a perspective</label><select id="role"><option value="coordinator">Coordinator view</option><option value="athlete">Athlete view</option><option value="expert">Expert view</option></select></div><div id="content"></div><div class="footer"><span>Stored only in this browser. Use fictional information.</span><button id="feedback">Capture feedback</button><button id="export">Export demo record</button><button id="reset">Reset demo</button></div></main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='foundry-sports-demo-v1';
const seed=()=>({version:1,permissions:[false,false,false],understood:false,tasks:[{id:'permission',title:'Confirm appearance permission',owner:'Demo coordinator',due:'Day 1',status:'HOLD',submitted:false,detail:'Check that the fictional athlete, institution and sponsor have approved the specified appearance. A simulated PASS here requires all three preparation checks.'},{id:'intro',title:'Prepare athlete introduction',owner:'Athlete A (fictional adult)',due:'Day 3',status:'OPEN',submitted:false,detail:'Prepare a 100-word introduction for a fictional adult community clinic. Acceptance: accurate approved wording, no unrelated brand references, and athlete confirmation.'},{id:'recap',title:'Submit clinic recap',owner:'Athlete A (fictional adult)',due:'Day 5',status:'OPEN',submitted:false,detail:'Provide a fictional delivery note. Acceptance: one approved recap, the agreed appearance recorded, and no unapproved participants or media.'}],decisions:[],guidance:[],feedback:[],planSaved:false,venture:''});
let state;try{const s=JSON.parse(localStorage.getItem(KEY));state=s&&s.version===1&&Array.isArray(s.tasks)&&s.tasks.length===3&&Array.isArray(s.permissions)&&s.permissions.length===3&&Array.isArray(s.decisions)&&Array.isArray(s.guidance)&&Array.isArray(s.feedback)?s:seed()}catch{state=seed()}
let page='deliver',role='coordinator',selected='permission',storageAvailable=true;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageAvailable=false;toast('Browser storage unavailable; this session still works. Export to keep it.')}}
let timer;function toast(s){$('#toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',4500)}
function badge(s){return `<span class="status ${s.toLowerCase()}">${esc(s)}</span>`}
function openDialog(title,body){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog').showModal()}$('#close').onclick=()=>$('#dialog').close();
function header(title,sub){return `<h1>${title}</h1><p class="sub">${sub}</p>`}
function assignment(){return '<div class="assignment"><h2>Community skills clinic</h2><div class="muted">Al Wadi Sports · Fictional assignment · Adult athlete</div></div>'}
function render(){document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});$('#content').innerHTML=page==='prepare'?prepare():page==='build'?build():deliver();bind()}
function prepare(){const names=['Athlete appearance permission','Institution assignment authority','Sponsor brief permission'];return header('Start with a clear agreement.','Understand the opportunity, the permissions and the next step.')+assignment()+`<div class="two"><section class="panel"><h2>Assignment brief</h2><p>One community skills clinic, an approved introduction and a short recap. A fictional adult athlete participates; a coordinator reviews the work.</p><div class="log"><strong>Acceptance criteria</strong>Approved wording, agreed appearance, accepted recap and a clear contribution record.</div><div class="log"><strong>What remains private</strong>Unrelated contracts, personal contacts, negotiation strategy and financial details.</div><div class="log"><strong>Named demo reviewer</strong>Demo coordinator — role switching illustrates views only.</div></section><section class="panel"><h2>Permission checklist</h2><p>These checks only simulate permission. No legal authority is created.</p>${names.map((n,i)=>`<div class="permission"><div><strong>${n}</strong><small>${state.permissions[i]?'Demo check recorded':'Awaiting demo check'}</small></div><button data-permission="${i}" ${role!=='coordinator'?'disabled':''}>${state.permissions[i]?'Undo check':'Simulate check'}</button></div>`).join('')}<p class="tiny">Only coordinator view can change this checklist. Actual deployment needs authenticated permissions and qualified review.</p></section></div><section class="panel" style="margin-top:16px"><h2>Your next step</h2><p>Prepare the introduction for review. Do not publish or appear until the accountable humans have confirmed the necessary permissions.</p><div class="check"><input id="understood" type="checkbox" ${state.understood?'checked':''} ${role!=='athlete'?'disabled':''}><label for="understood">In this fictional example, I understand the assignment and know whom to ask for help.</label></div><p class="tiny">Study withdrawal, data deletion and contractual obligations are separate matters. The demo establishes none of them.</p><button data-go="deliver">Go to assignment</button></section>`}
function deliver(){const chosen=state.tasks.find(t=>t.id===selected)||state.tasks[0];const accepted=state.tasks.filter(t=>t.id!=='permission'&&t.status==='PASS');return header('Turn opportunity into completed work.','One shared assignment. Clear responsibilities. Human decisions.')+assignment()+`<div class="grid"><div class="stack"><section class="panel"><h2>Assignment work plan</h2>${state.tasks.map(t=>`<div class="task"><div class="task-title">${esc(t.title)}${t.submitted?'<div class="tiny">Submitted for demo review</div>':''}</div>${badge(t.status)}<div class="task-meta">Owner: ${esc(t.owner)}<br>Due: ${t.due}</div><button data-task="${t.id}" aria-label="Open ${esc(t.title)}">Open</button></div>`).join('')}</section><section class="panel"><h2>${role==='coordinator'?'Human review':role==='athlete'?'Your assignment':'Expert review boundary'}</h2>${role==='coordinator'?`<label for="review-task">Review item</label><select id="review-task">${state.tasks.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.title)}</option>`).join('')}</select><p class="tiny" style="margin-top:8px">${esc(chosen.detail)}</p><label for="reason">Decision reason</label><textarea id="reason" maxlength="1200" placeholder="Add a brief reason for your decision."></textarea><div class="review-row"><div><label for="decision">Decision</label><select id="decision"><option value="">Select a decision</option>${['PASS','HOLD','REDIRECT','STOP'].map(x=>`<option>${x}</option>`).join('')}</select></div><button id="record" class="primary">Record simulated decision</button></div><div id="review-error" class="error" role="alert"></div>`:role==='athlete'?`<p>Open a task to see the agreed output and submit a fictional draft. You cannot approve your own delivery.</p><div class="banner">${state.understood?'Your demo understanding check is recorded.':'Visit Prepare to confirm that you understand the assignment.'}</div><button data-go="prepare">Check the brief</button>`:`<p>Your role is to offer guidance. Assignment acceptance belongs to the coordinator; expertise does not confer rights authority.</p><button id="expert-open">Review guidance requests</button>`}</section><section class="panel"><h2>Contribution record</h2>${accepted.length?accepted.map(t=>`<div class="log"><strong>${esc(t.title)}</strong>Demo accepted contribution · ${esc(t.owner)}<br><span class="tiny">Synthetic record; no certification, ownership or payment.</span></div>`).join(''):'<div class="empty">No accepted work yet.</div>'}${state.decisions.slice(-3).reverse().map(d=>`<div class="log"><strong>${esc(d.outcome)} · ${esc(d.title)}</strong>${esc(d.reason)}<div class="tiny">${esc(d.reviewer)} · ${esc(new Date(d.at).toLocaleString())} · Simulated decision</div></div>`).join('')}</section></div><section class="panel guidance"><h2>Expert guidance</h2><p>Ask the right question before the next decision.</p><button id="request" class="primary">${role==='expert'?'Review guidance':'Request guidance'}</button><p class="tiny">Example knowledge is fictional, not Gérard's or another professional's advice. No live model is connected.</p>${state.guidance.length?state.guidance.slice(-3).reverse().map(g=>`<div class="log"><strong>${esc(g.topic)}</strong>${esc(g.question)}<div class="tiny">${g.answer?'Reviewed example response':'Awaiting demo expert response'}</div>${g.answer?`<p style="margin-top:8px">${esc(g.answer)}</p>`:''}</div>`).join(''):'<div class="empty">No guidance requested yet.</div>'}</section></div>`}
function build(){const count=state.tasks.filter(t=>t.id!=='permission'&&t.status==='PASS').length;return header('Build from work you can show.','Accepted contributions inform the next step. Ownership needs executed agreements.')+`<div class="banner">Proposed pathway · This demonstration does not certify capability or grant equity.</div><div class="steps"><section class="step"><div class="number">01 / EXPERIENCE</div><h2>What you delivered</h2><p class="muted">${count} of 2 fictional deliverables accepted in this browser. This is an operating milestone, not verified professional capability.</p><button data-go="deliver">View contribution record</button></section><section class="step"><div class="number">02 / RESPONSIBILITY</div><h2>What comes next</h2><p class="muted">Discuss a supervised second assignment, a skill gap and the responsibility you are ready to accept with a named human mentor.</p></section><section class="step"><div class="number">03 / ENTERPRISE</div><h2>Explore a service venture</h2><p class="muted">Test who would buy your service, what it costs to deliver and which permissions are needed before discussing ownership.</p></section></div><section class="panel"><h2>Next-step planning note</h2><label for="venture">Fictional service idea</label><textarea id="venture" maxlength="1200" placeholder="Example: supervised community-clinic delivery for local institutions.">${esc(state.venture)}</textarea><button id="save-plan" class="primary" style="margin-top:12px">Save planning note</button><p class="tiny" style="margin-top:10px">Candidate → Apprentice → Verified Operator → Team Lead → Venture Owner → Builder/Mentor. Advancement requires published criteria and human decisions. This demo performs no advancement.</p></section>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-permission]').forEach(b=>b.onclick=()=>{if(role!=='coordinator')return;const i=+b.dataset.permission;state.permissions[i]=!state.permissions[i];if(!state.permissions.every(Boolean)&&state.tasks[0].status==='PASS'){state.tasks[0].status='HOLD';state.decisions.push({title:state.tasks[0].title,outcome:'HOLD',reason:'Demo permission check removed; re-review required.',reviewer:'Demo dependency check',at:new Date().toISOString()});state.tasks.slice(1).forEach(t=>{if(t.status==='PASS'){t.status='HOLD';state.decisions.push({title:t.title,outcome:'HOLD',reason:'Upstream demo permission withdrawn; re-review required.',reviewer:'Demo dependency check',at:new Date().toISOString()})}})}save();render()});if($('#understood'))$('#understood').onchange=e=>{if(role!=='athlete')return;state.understood=e.target.checked;save()};document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>showTask(b.dataset.task));if($('#review-task'))$('#review-task').onchange=e=>{selected=e.target.value;render()};if($('#record'))$('#record').onclick=recordDecision;if($('#request'))$('#request').onclick=()=>role==='expert'?expertRequests():requestGuidance();if($('#expert-open'))$('#expert-open').onclick=expertRequests;if($('#save-plan'))$('#save-plan').onclick=()=>{state.venture=$('#venture').value.trim();state.planSaved=true;save();toast('Planning note saved in this browser.')}}
function showTask(id){const t=state.tasks.find(t=>t.id===id);selected=id;render();openDialog(t.title,`<p class="muted">${esc(t.detail)}</p><p><strong>Owner:</strong> ${esc(t.owner)} · ${t.due}</p><p>${badge(t.status)}</p>${role==='athlete'&&id!=='permission'?`<label for="draft">Fictional delivery note</label><textarea id="draft" maxlength="1200" placeholder="Describe the fictional output for review.">${esc(t.draft||'')}</textarea><div class="error" id="draft-error" role="alert"></div><button class="primary" id="submit-draft">Submit for demo review</button>`:'<p class="tiny">Only the fictional adult athlete can submit deliverables. Only coordinator view records assignment decisions.</p>'}`);if($('#submit-draft'))$('#submit-draft').onclick=()=>{const v=$('#draft').value.trim();if(!v){$('#draft-error').textContent='Add a fictional delivery note.';return}if(state.tasks[0].status!=='PASS'){ $('#draft-error').textContent='The demo permission item must receive PASS before submission.';return}if(!state.understood){$('#draft-error').textContent='Confirm your understanding in Prepare first.';return}t.draft=v;t.submitted=true;t.status='OPEN';save();$('#dialog').close();render();toast('Fictional draft submitted; coordinator review required.')}}
function recordDecision(){if(role!=='coordinator')return;const t=state.tasks.find(x=>x.id===selected),reason=$('#reason').value.trim(),outcome=$('#decision').value;const err=$('#review-error');if(!outcome||!reason){err.textContent='Select a decision and add a reason.';return}if(outcome==='PASS'&&t.id==='permission'&&!state.permissions.every(Boolean)){err.textContent='Complete all three simulated permission checks in Prepare first.';return}if(outcome==='PASS'&&t.id!=='permission'&&(!t.submitted||state.tasks[0].status!=='PASS')){err.textContent='PASS requires an athlete submission and a permission PASS.';return}t.status=outcome;state.decisions.push({title:t.title,outcome,reason,reviewer:'Demo coordinator',at:new Date().toISOString()});if(t.id==='permission'&&outcome!=='PASS'){state.tasks.slice(1).forEach(x=>{if(x.status==='PASS'){x.status='HOLD';state.decisions.push({title:x.title,outcome:'HOLD',reason:'Upstream permission decision changed; re-review required.',reviewer:'Demo dependency check',at:new Date().toISOString()})}})}save();render();toast('Simulated decision recorded. No real approval was issued.')}
function requestGuidance(){openDialog('Request expert guidance','<p class="muted">Use a fictional question. This goes into the local demo queue, not to a real expert.</p><label for="topic">Topic</label><select id="topic"><option>Assignment scope</option><option>Career next step</option><option>Brand fit</option></select><label for="question">Your question</label><textarea id="question" maxlength="1200" placeholder="Which part of this fictional brief needs clarification?"></textarea><div id="request-error" class="error" role="alert"></div><button id="send-request" class="primary">Add demo request</button>');$('#send-request').onclick=()=>{const q=$('#question').value.trim();if(!q){$('#request-error').textContent='Add a fictional question.';return}state.guidance.push({id:Date.now(),topic:$('#topic').value,question:q,requestedBy:role,answer:'',at:new Date().toISOString()});save();$('#dialog').close();render();toast('Request added locally. Switch to Expert view to respond.')}}
function expertRequests(){openDialog('Expert guidance queue',`<p class="muted">Responses are fictional examples entered by you. No real expert or AI is answering.</p>${state.guidance.length?state.guidance.map(g=>`<div class="log"><strong>${esc(g.topic)}</strong><p>${esc(g.question)}</p><label for="answer-${g.id}">Example response</label><textarea id="answer-${g.id}" maxlength="1200" ${role!=='expert'?'disabled':''}>${esc(g.answer)}</textarea><button data-answer="${g.id}" ${role!=='expert'?'disabled':''}>Save demo response</button></div>`).join(''):'<div class="empty">No requests. Add one in athlete or coordinator view.</div>'}`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(role!=='expert')return;const g=state.guidance.find(g=>g.id===+b.dataset.answer),answer=$('#answer-'+g.id).value.trim();if(!answer){toast('Add an example response first.');return}g.answer=answer;g.reviewedBy='Demo expert';save();$('#dialog').close();render();toast('Example guidance saved. Assignment decision remains with coordinator.')})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#role').onchange=e=>{role=e.target.value;$('#dialog').close();render()};
$('#feedback').onclick=()=>{openDialog('Capture discovery feedback','<p class="muted">Record an anonymous critique. Do not enter names or private information. Feedback stays in this browser until you export it.</p><label for="feedback-role">Perspective</label><select id="feedback-role"><option>Athlete</option><option>Coordinator / agency</option><option>Expert / mentor</option><option>Institution / budget owner</option></select><label for="useful">What was useful?</label><textarea id="useful" maxlength="1200"></textarea><label for="missing">What was confusing or missing?</label><textarea id="missing" maxlength="1200"></textarea><label for="current">What is used today?</label><input id="current" maxlength="500"><label for="next">Next evidence we need</label><input id="next" maxlength="500" placeholder="Example: authorized anonymized assignment"><div id="feedback-error" class="error" role="alert"></div><button id="save-feedback" class="primary">Save anonymous feedback</button>');$('#save-feedback').onclick=()=>{if(!$('#useful').value.trim()&&!$('#missing').value.trim()){$('#feedback-error').textContent='Add a useful point or a missing point.';return}state.feedback.push({role:$('#feedback-role').value,useful:$('#useful').value.trim(),missing:$('#missing').value.trim(),current:$('#current').value.trim(),next:$('#next').value.trim(),at:new Date().toISOString(),status:'REPORTED concept feedback; not traction'});save();$('#dialog').close();toast('Anonymous feedback saved locally.')}};
$('#export').onclick=()=>{const record={classification:'PROPOSAL / SYNTHETIC DEMO',exportedAt:new Date().toISOString(),limitations:'No authentication, live AI, legally effective approvals, immutable provenance, ownership or production data protections.',...state};const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='foundry-sports-demo-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Demo record exported.')};
$('#reset').onclick=()=>{openDialog('Reset this browser demo','<p>Remove this browser’s fictional tasks, decisions, guidance, planning note and feedback? Export first if you want to keep them.</p><div class="actions"><button id="confirm-reset" class="primary">Reset demo data</button><button id="cancel-reset">Keep data</button></div>');$('#cancel-reset').onclick=()=>$('#dialog').close();$('#confirm-reset').onclick=()=>{state=seed();selected='permission';save();$('#dialog').close();render();toast('Demo reset.')}};
save();render();
</script>
</body>
</html>
